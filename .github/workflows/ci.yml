name: CI hospitalario

on:
  push: {}
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar compilación
        run: python -m compileall -q hospital tests
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
